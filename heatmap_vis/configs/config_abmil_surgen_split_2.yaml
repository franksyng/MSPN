# CUDA_VISIBLE_DEVICES=0,1 python create_heatmaps.py --config config_template.yaml
--- 
exp_arguments:
  # number of classes
  n_classes: 4
  # name tag for saving generated figures and assets
  save_exp_code: HEATMAP_OUTPUT 
  # where to save raw asset files
  raw_save_dir: heatmaps/abmil_surgen_s2/heatmaps_s2/heatmap_raw_results
  # where to save final heatmaps
  production_save_dir: heatmaps/abmil_surgen_s2/heatmaps_s2/heatmap_production_results
  batch_size: 256
data_arguments: 
  # where is data stored; can be a single str path or a dictionary of key, data_dir mapping
  data_dir: /media/frank/Expansion/surgen_corrected/
  # data_dir: /media/frank/FlashVol1/all_data/clean/test_slides_corrected
  # data_dir: /media/frank/FlashVol1/all_data/clean/gigapath_feats/leica_1st_he_256_feats/
  # column name for key in data_dir (if a dict mapping is used)
  data_dir_key: source
  # csv list containing slide_ids (can additionally have seg/patch paramters, class labels, etc.)
  process_list: annotations_surgen_surv.csv
  split_info: /home/frank/PycharmProjects/mrs_bc/annotations/5fold_splits_surgen_surv/splits_2.csv
  split_num: 2
  # preset file for segmentation/patching
  preset: /home/frank/PycharmProjects/mrs_bc/CLAM_modified/presets/mrs_bc.csv
  # file extention for slides
  slide_ext: .tif
  # label dictionary for str: interger mapping (optional)
  receptor_type: surgen_surv
  optimal_threshold: None
  label_dict:
    '0': 0
    '1': 1
    '2': 2
    '3': 3                        
patching_arguments:
  # arguments for patching
  patch_size: 256
  overlap: 0
  patch_level: 1
  custom_downsample: 1
model_arguments: 
  # arguments for initializing model from checkpoint
  ckpt_path: /home/frank/PycharmProjects/rpn_mil/results/conch/surv/abmil_surgen_surv_b1_gc32_adamw_e150_lr0.0002_nll_surv_CALR/split_2/ckpt/best_val.pt
  #ckpt_path: /home/frank/PycharmProjects/mrs_bc/receptor_pred/results/gigapath/leica/small/amil_er_b1_gc16_adamw_e150_lr0.002_ce_CA/split_0/ckpt/best_val.pt
  model_type: abmil # see utils/eval_utils/
  initiate_fn: initiate_model # see utils/eval_utils/
  model_size: small
  drop_out: true
heatmap_arguments:
  # whether generate high reso heatmap
  gen_high_reso_map: true
  # downsample at which to visualize heatmap (-1 refers to downsample closest to 32x downsample)
  vis_level: 4
  # transparency for overlaying heatmap on background (0: background only, 1: foreground only)
  alpha: 0.4
  # whether to use a blank canvas instead of original slide
  blank_canvas: false
  # whether to also save the original H&E image
  save_orig: true
  # file extension for saving heatmap/original image
  save_ext: jpg
  # whether to calculate percentile scores in reference to the set of non-overlapping patches
  use_ref_scores: false
  # whether to use gaussian blur for further smoothing
  blur: true
  # whether to shift the 4 default corner points for checking if a patch is inside a foreground contour
  use_center_shift: true
  # whether to only compute heatmap for ROI specified by x1, x2, y1, y2
  use_roi: false 
  # whether to calculate heatmap with specified overlap (by default, coarse heatmap without overlap is always calculated)
  calc_heatmap: true
  # whether to binarize attention scores
  binarize: false
  # binarization threshold: (0, 1)
  binary_thresh: 0.7
  # factor for downscaling the heatmap before final dispaly
  custom_downsample: 1
  cmap: jet
sample_arguments:
  samples:
    - name: "topk_high_attn"
      sample: true
      seed: 1
      k: 0 # save top-k patches
      mode: topk
extractor_arguments:
  ctrans_ckpt: '/home/frank/PycharmProjects/mrs_bc/preprocessing/ctrans_ckpt/ctranspath.pth'



